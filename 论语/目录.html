  .sect li { font-size:14px; line-height:1.9; padding-left:1em; text-indent:-1em; }
  .sect li::before { content:"· "; color:var(--grey); }
  .pager { display:flex; justify-content:space-between; margin-top:56px; padding-top:22px;
